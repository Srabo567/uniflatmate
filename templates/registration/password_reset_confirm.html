{% extends "base.html" %}
{% block content %}
  {% if validlink %}
    <h1>Set a new password</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button>Save new password</button></form>
  {% else %}
    <h1>That link didn't work</h1>
    <p>Reset links work once and then expire.</p>
    <a href="{% url 'password_reset' %}">Send a new link</a>
  {% endif %}
{% endblock %}
