{% extends "base.html" %}
{% block content %}
  <h1>UniFlatMate</h1>
  <p>Find a compatible roommate — not just a room.</p>
  {% if user.is_authenticated %}
    <a href="{% url 'matching:match_list' %}">See your matches</a>
  {% else %}
    <a href="{% url 'accounts:signup' %}">Create an account</a>
    <a href="{% url 'login' %}">Log in</a>
  {% endif %}
{% endblock %}
