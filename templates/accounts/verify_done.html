{% extends "base.html" %}
{% block title %}Verified · UniFlatMate{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6 py-4">
      <div class="uf-card uf-card--flat p-4 text-center">
        <div class="uf-icon mx-auto mb-3">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m8 12.5 2.8 2.8L16.5 9.5"></path>
          </svg>
        </div>
        <span class="uf-pill uf-pill--verified">Email verified</span>
        <h1 class="h4 mt-3 mb-2">Welcome, {{ username }}</h1>
        <p class="uf-muted">
          Your account is active and your profile is now part of the
          compatibility pool at your university.
        </p>
        <a class="btn btn-uf" href="{% url 'login' %}">Log in</a>
      </div>
    </div>
  </div>
{% endblock %}
